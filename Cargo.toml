[package]
name = "disk-capture"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT AND LGPL-2.1-only AND LGPL-2.1-or-later"
repository = "https://github.com/CaddyGlow/disk-capture"
description = "Read-only offline NTFS metadata and logical-stream capture over virtdisk readers"

readme = "README.md"
homepage = "https://github.com/CaddyGlow/disk-capture"
keywords = ["ntfs", "disk", "capture", "windows"]
categories = ["filesystem", "parser-implementations"]

[dependencies]
ntfs = { package = "caddy-ntfs", version = "0.4.1" }
virtdisk = { version = "0.3.1" }
ms-compress = { version = "0.2.1" }
sha2 = "0.10"

[dev-dependencies]
partmgr = { version = "0.1.2" }
binrw = { version = "0.11.3", default-features = false }
tempfile = "3.23"
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
exclude = ["fuzz"]
